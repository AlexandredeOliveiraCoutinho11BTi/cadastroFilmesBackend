<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro.css">
    <title>Cadastrar Filmes</title>
</head>
<body>
    <header>
        <a href="../index.html">Voltar</a>
        <h1>Cadastrar novos filmes</h1>
    </header>

    <main>
        <form>
            <div>
                <label for="title">Título do filme:</label>
                <input type="text" id="title" placeholder="Digite aqui o título">
            </div>
            <div>
                <label for="genre">Gênero:</label>
                <input type="text" id="genre" placeholder="Digite aqui o gênero">
            </div>
            <div>
                <label for="classificacao_etaria">Classificação indicativa:</label>
                <input type="number" id="classificacao_etaria" placeholder="Digite aqui a classificação indicativa">
            </div>
            <div>
                <label for="duration">Duração:</label>
                <input type="number" id="duration" placeholder="Digite aqui a duração">
            </div>
        </form>

        <button onclick="cadastrarFilme()">Cadastrar</button>
    </main>

    <script src="./cadastro.js"></script>
</body>
</html>
